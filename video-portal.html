<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VIDEO PORTAL / 手部抠洞播放</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060c;
    font-family:"SF Mono",Consolas,"Roboto Mono",monospace;color:#bfe9ff;
    -webkit-tap-highlight-color:transparent}
  video{display:block}

  /* 底层：后台播放的视频 */
  #bgvideo{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}

  /* 上层：摄像头 + 挖洞遮罩（同一张画布，洞是透明的） */
  #mask{position:fixed;left:0;top:0;width:100%;height:100%;z-index:2;pointer-events:none}

  /* 隐藏的取景源 */
  #cam{position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none}

  /* 骨架叠加 */
  #skel{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}

  /* 网格 / 扫描 / 颗粒 */
  #grid{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.22;
    background-image:linear-gradient(rgba(57,230,255,.18) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(57,230,255,.18) 1px,transparent 1px);
    background-size:52px 52px;
    -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 15%,transparent 72%);
    mask-image:radial-gradient(circle at 50% 50%,#000 15%,transparent 72%)}
  #scan{position:fixed;inset:0;z-index:5;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(120,220,255,.045) 0 1px,transparent 1px 4px)}
  #noise{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.05;mix-blend-mode:screen;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
  #vign{position:fixed;inset:0;z-index:7;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(3,4,10,.75) 100%)}

  /* HUD */
  #hud{position:fixed;z-index:9;top:calc(18px + env(safe-area-inset-top));left:20px;pointer-events:none;letter-spacing:.14em}
  #hud h1{font-size:13px;font-weight:700;color:#eafcff;text-shadow:0 0 16px rgba(57,230,255,.9)}
  #hud .sub{margin-top:4px;font-size:9px;color:#4d7fa8;letter-spacing:.18em}
  #state{margin-top:11px;font-size:11px;color:#7cf0d0;text-shadow:0 0 14px rgba(60,240,200,.7)}
  #state.live{color:#39e6ff;text-shadow:0 0 14px rgba(57,230,255,.9)}
  #state.ok{color:#5cffb0}#state.warn{color:#ffb35c}#state.bad{color:#ff6b9e}
  #state.full{color:#ff7ad0;text-shadow:0 0 16px rgba(255,92,200,.95)}
  #meta{margin-top:6px;font-size:9px;color:#5c7fa8;display:flex;gap:12px;flex-wrap:wrap}
  #loadState{margin-top:6px;font-size:9px;color:#8fb0dd;max-width:46vw;word-break:break-all}

  #hint{position:fixed;z-index:9;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));
    transform:translateX(-50%);font-size:11px;letter-spacing:.16em;color:#8fd8ff;
    background:rgba(6,18,34,.62);border:1px solid rgba(57,230,255,.32);border-radius:22px;
    padding:9px 20px;backdrop-filter:blur(10px);pointer-events:none;opacity:0;transition:opacity .35s;text-align:center}
  #hint.on{opacity:1}

  #fullbar{position:fixed;z-index:9;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translateX(-50%);
    width:min(320px,52vw);pointer-events:none;opacity:0;transition:opacity .4s}
  #fullbar .lbl{font-size:9px;color:#ff7ad0;letter-spacing:.2em;text-align:center;margin-bottom:5px;
    text-shadow:0 0 12px rgba(255,92,200,.8)}
  #fullbar .track{height:4px;border-radius:3px;background:rgba(57,230,255,.16);overflow:hidden}
  #fullbar .fill2{height:100%;width:0%;border-radius:3px;
    background:linear-gradient(90deg,#39e6ff,#b14bff,#ff3fa0);transition:width .12s linear}

  #dock{position:fixed;z-index:10;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:0 12px}
  button{font-family:inherit;font-size:11px;letter-spacing:.13em;padding:12px 19px;border-radius:9px;
    color:#dcf6ff;background:linear-gradient(180deg,rgba(20,60,110,.74),rgba(10,22,44,.88));
    border:1px solid rgba(57,230,255,.45);cursor:pointer;transition:.24s;backdrop-filter:blur(10px);
    text-shadow:0 0 10px rgba(57,230,255,.5)}
  button:hover{background:linear-gradient(180deg,rgba(30,110,190,.82),rgba(14,36,70,.92));
    box-shadow:0 0 22px rgba(57,230,255,.5);border-color:rgba(255,92,200,.6)}
  button:disabled{opacity:.45;cursor:default}

  #tuner{position:fixed;z-index:10;right:20px;top:calc(18px + env(safe-area-inset-top));
    width:236px;background:rgba(6,14,28,.66);border:1px solid rgba(57,230,255,.26);
    border-radius:11px;padding:12px 15px;backdrop-filter:blur(12px);
    box-shadow:0 0 24px rgba(57,230,255,.12)}
  #tuner .row2{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;color:#8fc4e8;margin:6px 0 4px}
  #tuner .val{color:#39e6ff;text-shadow:0 0 10px rgba(57,230,255,.7)}
  #tuner input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;
    border-radius:3px;background:linear-gradient(90deg,#39e6ff,#b14bff,#ff3fa0);outline:none;margin-bottom:8px}
  #tuner input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:#eafcff;border:2px solid #39e6ff;cursor:pointer;
    box-shadow:0 0 14px rgba(57,230,255,.95)}
  #tuner input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
    background:#eafcff;border:2px solid #39e6ff;cursor:pointer}
  #glitch{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;
    background:repeating-linear-gradient(180deg,rgba(255,60,160,.16) 0 2px,transparent 2px 5px);
    mix-blend-mode:screen;transition:opacity .12s}
  #hex{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.16}
  #guide{position:fixed;z-index:9;right:20px;bottom:calc(18px + env(safe-area-inset-bottom));
    width:252px;font-size:10px;line-height:1.9;color:#8fc4e8;
    background:rgba(6,14,28,.62);border:1px solid rgba(57,230,255,.24);
    border-radius:11px;padding:13px 16px;backdrop-filter:blur(12px);pointer-events:none}
  #guide b{color:#eafcff}#guide .k{color:#39e6ff}#guide .p{color:#ff7ad0}

  #err,#boot{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);max-width:78vw;
    padding:20px 24px;border-radius:13px;background:rgba(34,6,20,.95);
    border:1px solid rgba(255,92,200,.55);color:#ffd0ea;font-size:12px;line-height:1.75;
    display:none;text-align:center;box-shadow:0 0 40px rgba(255,60,160,.3);word-break:break-all}

  @media (max-width:820px){
    #guide{display:none}
    #hud{left:14px}#hud h1{font-size:12px}
    #loadState{max-width:60vw}
    button{padding:10px 14px;font-size:10px}
  }
</style>
</head>
<body>
<!-- 底层：正在播放的视频（被上层的洞透出来） -->
<video id="bgvideo" playsinline loop crossorigin="anonymous"></video>

<!-- 上层：摄像头画面 + 挖洞后的透明遮罩 -->
<canvas id="mask"></canvas>

<!-- 取景源与骨架 -->
<video id="cam" playsinline muted autoplay></video>
<canvas id="skel"></canvas>

<div id="grid"></div><div id="scan"></div><div id="noise"></div><div id="vign"></div>

<div id="hud">
  <h1>VIDEO PORTAL</h1>
  <div class="sub">HAND-FRAMED HOLE / CAMERA + VIDEO</div>
  <div id="state">STANDBY</div>
  <div id="meta"><span id="hands">HANDS: 0</span><span id="fps">FPS --</span></div>
  <div id="loadState">未载入视频</div>
</div>

<div id="fullbar">
  <div class="lbl">FULLSCREEN PROGRESS (80%)</div>
  <div class="track"><div class="fill2"></div></div>
</div>

<div id="tuner">
  <div class="row2">
    <span class="lab">触发阈值</span>
    <span class="val" id="thVal">80%</span>
  </div>
  <input id="th" type="range" min="30" max="95" step="1" value="80">
  <div class="row2">
    <span class="lab">口子羽化</span>
    <span class="val" id="fwVal">8</span>
  </div>
  <input id="fw" type="range" min="0" max="24" step="1" value="8">
</div>

<div id="hint"></div>

<div id="guide">
  <b>玩法</b><br>
  <span class="k">一只手</span> 握拳 / 五指并拢 → 视作一个点<br>
  <span class="k">另一只手</span> 五指 → 与点连线<br>
  <span class="p">双手食指+拇指</span> → 构成矩形<br>
  <span class="p">矩形</span> → 像漏洞一样看到后台视频<br>
  <span class="p">矩形</span> 内实时透出视频画面<br>
  <span class="k">撑满阈值</span> → 全屏接管并锁定，不再退回<br>
  <span class="k">矩形内</span> 视频 · <span class="k">矩形外</span> 摄像头<br>
  <span class="k">阈值</span> 右上角滑杆实时调节<br>
  <span class="k">先载入</span> 你自己的视频文件
</div>

<div id="dock">
  <button id="pick">载入我的视频</button>
  <button id="start">启用摄像头</button>
  <button id="demoVideo">示例视频</button>
  <button id="exitFull" style="display:none">退出全屏</button>
</div>
<input id="file" type="file" accept="video/*" style="display:none">

<div id="boot"></div>
<div id="err"></div>

<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('boot');
  if (el) { el.style.display = 'block'; el.textContent = 'BOOT ERROR: ' + (e.message || 'unknown'); }
}, true);
window.addEventListener('unhandledrejection', function (e) {
  var r = e && e.reason;
  var el = document.getElementById('boot');
  if (el) { el.style.display = 'block'; el.textContent = 'BOOT ERROR: ' + ((r && (r.name + ' ' + r.message)) || r); }
});
setTimeout(function () {
  if (!window.__ready) {
    var el = document.getElementById('boot');
    if (el) { el.style.display = 'block'; el.textContent = 'BOOT TIMEOUT：模块未启动'; }
  }
}, 9000);
</script>
<script type="module">

/* ============ VIDEO PORTAL / 手部抠洞播放 ============ */
const $ = s => document.querySelector(s);
const cam = $('#cam'), skel = $('#skel'), sctx = skel.getContext('2d');
const bgVideo = $('#bgvideo');
const stateEl = $('#state'), handsEl = $('#hands'), hintEl = $('#hint'), errEl = $('#err'), bootEl = $('#boot');

const CYAN = 'rgba(57,230,255,', PINK = 'rgba(255,92,200,';
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

/* ---------- 状态 ---------- */
let mode = 'idle';            // idle | point | rect | full
let reveal = 0, targetReveal = 0;   // 0..1 洞的张开度
let fullMix = 0, targetFull = 0;    // 0..1 全屏混合
let lastList = [];
let FULL_THRESHOLD = 0.80;          // 可调：矩形占屏比例阈值（全屏触发）
let isFull = false;                 // 是否已进入全屏（带滞回）
let rect = { x: 0, y: 0, w: 0, h: 0, cx: 0, cy: 0, ang: 0 };
let smoothRect = null;
let pointPos = null;           // 单点（握指手）
let otherTips = [];            // 另一只手五指指尖
let lastSeen = 0, camOn = false, hasUserVideo = false;

/* ---------- 元素尺寸 ---------- */
function resizeSkel() {
  const r = skel.getBoundingClientRect();
  const W = Math.round(r.width * 2), H = Math.round(r.height * 2);
  if (skel.width !== W || skel.height !== H) { skel.width = W; skel.height = H; }
}
addEventListener('resize', resizeSkel);

/* ---------- 手势判定 ---------- */
const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const scaleOf = lm => d2(lm[0], lm[9]) || 0.1;
function isPinchedPoint(lm) {
  // 握拳也视作一个点
  if (isFist(lm)) return true;
  const r = scaleOf(lm);
  const tips = [8, 12, 16, 20];
  const palm = lm[9];
  // 五指指尖互相靠近且都贴近掌心 = 视作一个点
  const near = tips.every(i => d2(lm[i], palm) < r * 1.25);
  const spread = Math.max(...tips.map(i => d2(lm[i], lm[4])));
  return near && spread < r * 1.5;
}
function tipsOf(lm) { return [4, 8, 12, 16, 20].map(i => lm[i]); }
/* 握拳：五指弯曲收拢，指尖贴近掌心 */
function isFist(lm) {
  const palm = lm[9], r = scaleOf(lm);
  // 四指指尖收拢贴近掌心，拇指同样收拢（阈值放宽到 1.05）
  const fingers = [8, 12, 16, 20].every(i => d2(lm[i], palm) < r * 1.05);
  const thumb = d2(lm[4], palm) < r * 1.25;
  return fingers && thumb;
}

/* ---------- 骨架绘制 ---------- */
function drawSkeleton(list, hasPoint) {
  resizeSkel();
  sctx.clearRect(0, 0, skel.width, skel.height);
  if (!list.length) return;
  const pt = p => ({ x: (1 - p.x) * skel.width, y: p.y * skel.height });
  sctx.lineCap = 'round';
  list.forEach((lm, idx) => {
    const isPointHand = hasPoint && idx === 0;
    sctx.strokeStyle = isPointHand ? PINK + '.9)' : CYAN + '.85)';
    sctx.shadowColor = isPointHand ? PINK + '1)' : CYAN + '1)';
    sctx.shadowBlur = 16; sctx.lineWidth = 3.2;
    for (const [i, j] of BONES) {
      const A = pt(lm[i]), B = pt(lm[j]);
      sctx.beginPath(); sctx.moveTo(A.x, A.y); sctx.lineTo(B.x, B.y); sctx.stroke();
    }
    sctx.shadowBlur = 0;
    sctx.fillStyle = CYAN + '.8)';
    for (let i = 0; i < lm.length; i++) {
      if ([4,8,12,16,20].includes(i)) continue;
      const q = pt(lm[i]);
      sctx.beginPath(); sctx.arc(q.x, q.y, 2.2, 0, Math.PI * 2); sctx.fill();
    }
    for (const i of [4, 8, 12, 16, 20]) {
      const q = pt(lm[i]);
      sctx.shadowColor = isPointHand ? CYAN + '1)' : PINK + '1)';
      sctx.shadowBlur = 18;
      sctx.fillStyle = isPointHand ? PINK + '.98)' : PINK + '.95)';
      sctx.beginPath(); sctx.arc(q.x, q.y, 4.6, 0, Math.PI * 2); sctx.fill();
    }
    sctx.shadowBlur = 0;
  });

  // 单点：五指汇聚成一个发光圆点
  if (hasPoint && list[0]) {
    const c = pt(list[0][9]);
    sctx.shadowColor = PINK + '1)'; sctx.shadowBlur = 30;
    sctx.fillStyle = PINK + '.95)';
    sctx.beginPath(); sctx.arc(c.x, c.y, 10, 0, Math.PI * 2); sctx.fill();
    sctx.strokeStyle = CYAN + '.9)'; sctx.lineWidth = 2.4;
    sctx.beginPath(); sctx.arc(c.x, c.y, 18, 0, Math.PI * 2); sctx.stroke();
    sctx.shadowBlur = 0;

    // 另一只手五指指尖 → 连线到这个点
    if (list[1]) {
      sctx.strokeStyle = CYAN + '.9)'; sctx.lineWidth = 2.4;
      sctx.shadowColor = CYAN + '1)'; sctx.shadowBlur = 16;
      for (const i of [4, 8, 12, 16, 20]) {
        const q = pt(list[1][i]);
        sctx.beginPath(); sctx.moveTo(q.x, q.y); sctx.lineTo(c.x, c.y); sctx.stroke();
        sctx.fillStyle = PINK + '.95)';
        sctx.beginPath(); sctx.arc(q.x, q.y, 4.2, 0, Math.PI * 2); sctx.fill();
      }
      sctx.shadowBlur = 0;
    }
  }

  // 矩形框：食指(8) 与 拇指(4) 构成的框
  if (mode === 'rect' && list[0] && list[1]) {
    const a = list[0], b = list[1];
    const p = projectRect(a, b);
    sctx.strokeStyle = CYAN + '.95)'; sctx.lineWidth = 3.4;
    sctx.shadowColor = CYAN + '1)'; sctx.shadowBlur = 20;
    sctx.beginPath();
    sctx.moveTo(p[0].x, p[0].y); sctx.lineTo(p[1].x, p[1].y);
    sctx.lineTo(p[2].x, p[2].y); sctx.lineTo(p[3].x, p[3].y);
    sctx.closePath(); sctx.stroke();
    sctx.shadowBlur = 0;
    for (const q of p) {
      sctx.fillStyle = PINK + '.95)';
      sctx.beginPath(); sctx.arc(q.x, q.y, 5.4, 0, Math.PI * 2); sctx.fill();
    }
  }
}

/* ---------- 用两手的食指与拇指构造矩形 ---------- */
function projectRect(a, b) {
  // 左手食指→右手食指 与 左手拇指→右手拇指 形成四边形
  const toPx = p => ({ x: (1 - p.x) * skel.width, y: p.y * skel.height });
  return [toPx(a[8]), toPx(b[8]), toPx(b[4]), toPx(a[4])];
}
function computeRectGeo(a, b) {
  const p = projectRect(a, b);
  const cx = (p[0].x + p[1].x + p[2].x + p[3].x) / 4;
  const cy = (p[0].y + p[1].y + p[2].y + p[3].y) / 4;
  let w = 0, h = 0;
  for (let i = 0; i < 4; i++) {
    const q = p[(i + 1) % 4];
    w = Math.max(w, Math.hypot(p[i].x - q.x, p[i].y - q.y));
  }
  const ang = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x);
  h = Math.abs(Math.hypot(p[1].x - p[3].x, p[1].y - p[3].y));
  return { x: p[0].x, y: p[0].y, w, h, cx, cy, ang, pts: p };
}

/* ---------- 遮罩渲染（摄像头为前景，洞口透出视频） ---------- */
const maskCanvas = $('#mask'), mctx = maskCanvas.getContext('2d');
function renderMask() {
  const W = maskCanvas.width, H = maskCanvas.height;
  mctx.globalCompositeOperation = 'source-over';
  mctx.clearRect(0, 0, W, H);

  // 前景：摄像头画面铺满
  mctx.save();
  mctx.filter = 'contrast(1.1) saturate(.9) brightness(.85)';
  if (camOn && cam.videoWidth) {
    mctx.translate(W, 0); mctx.scale(-1, 1);   // 镜像自拍
    mctx.drawImage(cam, 0, 0, W, H);
  } else {
    mctx.fillStyle = '#06070f'; mctx.fillRect(0, 0, W, H);
  }
  mctx.restore();

  // 洞口：把视频区域挖出来（destination-out 圆形 + 矩形）
  if (reveal > 0.001) {
    mctx.globalCompositeOperation = 'destination-out';
    if (mode === 'rect' && smoothRect) {
      const r = smoothRect;
      const pad = 10 * reveal;
      mctx.save();
      mctx.translate(r.cx, r.cy);
      mctx.rotate(r.ang);
      const rw = (r.w / 2 + pad), rh = (r.h / 2 + pad);
      const rad = Math.min(rw, rh) * 0.35;
      // 1) 先用极小的软边把矩形内部整体挖透（核心：保证内部 100% 透明）
      mctx.filter = 'blur(2px)';
      mctx.beginPath();
      roundRect(mctx, -rw, -rh, rw * 2, rh * 2, rad);
      mctx.fillStyle = 'rgba(0,0,0,1)';
      mctx.fill();
      mctx.filter = 'none';

      // 2) 羽化只作用在边缘一圈：向外扩张的环形渐进擦除
      if (FEATHER > 0) {
        const steps = 6;
        for (let i = steps; i >= 1; i--) {
          const k = i / steps;                 // 1 → 0
          const grow = FEATHER * (1 - k) + FEATHER * 0.5;
          const fw = rw + grow * k + FEATHER * 0.5;
          const fh = rh + grow * k + FEATHER * 0.5;
          mctx.globalAlpha = 0.92;
          mctx.filter = 'blur(' + Math.round(1 + FEATHER * 0.35) + 'px)';
          mctx.beginPath();
          roundRect(mctx, -fw, -fh, fw * 2, fh * 2, rad + grow * 0.4);
          mctx.fillStyle = 'rgba(0,0,0,1)';
          mctx.fill();
        }
        mctx.filter = 'none';
        mctx.globalAlpha = 1;
      }
      mctx.restore();
    } else if (pointPos) {
      // 单点模式：柔和光晕洞
      const radius = 90 * reveal;
      const g = mctx.createRadialGradient(pointPos.x, pointPos.y, radius * 0.3, pointPos.x, pointPos.y, radius);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(0.7, 'rgba(0,0,0,0.85)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      mctx.fillStyle = g;
      mctx.beginPath(); mctx.arc(pointPos.x, pointPos.y, radius, 0, Math.PI * 2); mctx.fill();
    }
    mctx.globalCompositeOperation = 'source-over';
  }

  // 全屏接管：整体淡出摄像头层
  if (fullMix > 0.001) {
    mctx.globalCompositeOperation = 'destination-out';
    mctx.globalAlpha = fullMix;
    mctx.fillStyle = '#000';
    mctx.fillRect(0, 0, W, H);
    mctx.globalAlpha = 1;
    mctx.globalCompositeOperation = 'source-over';
  }

}
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ---------- HUD ---------- */
function setState(txt, hint, cls) {
  stateEl.textContent = txt;
  stateEl.className = cls || '';
  if (hint) { hintEl.textContent = hint; hintEl.classList.add('on'); }
  else hintEl.classList.remove('on');
}


/* ---------- 赛博朋克特效层：六边形网格 ---------- */
const hexCanvas = document.createElement('canvas');
hexCanvas.id = 'hex'; document.body.appendChild(hexCanvas);
const hctx = hexCanvas.getContext('2d');
let hexT = 0;
function drawHexGrid() {
  const W = hexCanvas.width, H = hexCanvas.height;
  if (!W) return;
  hctx.clearRect(0, 0, W, H);
  const R = 46, t = hexT += 0.006;
  hctx.lineWidth = 1.2;
  for (let row = -1, y = 0; y < H + R; row++, y += R * 1.5) {
    for (let col = -1, x = 0; x < W + R; col++, x += R * Math.sqrt(3)) {
      const ox = x + (row % 2 ? R * Math.sqrt(3) / 2 : 0);
      const pulse = 0.5 + 0.5 * Math.sin(t * 3 + (row + col) * 0.6);
      hctx.strokeStyle = 'rgba(57,230,255,' + (0.05 + pulse * 0.11) + ')';
      hctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 6 + i * Math.PI / 3;
        const px = ox + Math.cos(a) * R, py = y + Math.sin(a) * R;
        i ? hctx.lineTo(px, py) : hctx.moveTo(px, py);
      }
      hctx.closePath(); hctx.stroke();
    }
  }
}
function resizeHex() {
  hexCanvas.width = innerWidth; hexCanvas.height = innerHeight;
}
resizeHex();
addEventListener('resize', resizeHex);

/* ---------- 故障闪屏 ---------- */
const glitchEl = document.createElement('div');
glitchEl.id = 'glitch'; document.body.appendChild(glitchEl);
function glitch() {
  glitchEl.style.opacity = '0.5';
  setTimeout(() => { glitchEl.style.opacity = '0'; }, 110);
}

/* ---------- 手势主逻辑 ---------- */
function onHands(list) {
  lastList = list;
  const now = performance.now();
  if (isFull) { handsEl.textContent = 'HANDS: 全屏已锁定'; return; }
  handsEl.textContent = 'HANDS: ' + list.length;
  if (!list.length) {
    if (isFull) { handsEl.textContent = 'HANDS: 0 / 全屏已锁定'; return; }
    if (now - lastSeen > 350) {
      mode = 'idle'; targetReveal = 0; pointPos = null;
      setState('IDLE', '把手放进画面', '');
    }
    return;
  }
  lastSeen = now;

  // 判定哪只手是"点"：五指靠拢
  let pointIdx = -1;
  for (let i = 0; i < list.length; i++) { if (isPinchedPoint(list[i])) { pointIdx = i; break; } }

  if (pointIdx >= 0 && list.length >= 2) {
    // 单点 + 另一只手五指连线
    mode = 'point';
    const oi = pointIdx === 0 ? 1 : 0;
    const c = list[pointIdx][9];
    pointPos = { x: (1 - c.x) * skel.width, y: c.y * skel.height };
    otherTips = tipsOf(list[oi]).map(p => ({ x: (1 - p.x) * skel.width, y: p.y * skel.height }));
    targetReveal = 0.85; targetFull = 0;
    setState('POINT / ' + list.length + '手', '一只手握成点，另一只手五指连线', 'live');
    return;
  }

  if (list.length >= 2) {
    const a = list[0], b = list[1];
    const g = computeRectGeo(a, b);
    rect = g;
    // 平滑
    if (!smoothRect) smoothRect = { x: g.x, y: g.y, w: g.w, h: g.h, cx: g.cx, cy: g.cy, ang: g.ang, pts: g.pts };
    else {
      const k = 0.35;
      smoothRect.cx += (g.cx - smoothRect.cx) * k;
      smoothRect.cy += (g.cy - smoothRect.cy) * k;
      smoothRect.w += (g.w - smoothRect.w) * k;
      smoothRect.h += (g.h - smoothRect.h) * k;
      smoothRect.ang += (g.ang - smoothRect.ang) * k;
      smoothRect.pts = g.pts;
    }
    mode = 'rect';
    pointPos = null;

    // 洞占屏比例 → 决定 reveal 与全屏
    const area = (rect.w * rect.h) / (skel.width * skel.height);
    targetReveal = 1;   // 口子始终完全透出视频
    // 撑满屏幕面积的 80% 时进入全屏，并锁定（不再响应手势）
    if (area >= FULL_THRESHOLD && !isFull) {
      // 达到阈值：进入全屏并永久锁定，不再退回
      isFull = true;
      targetFull = 1;
      glitch();
      setState('FULL / 全屏播放', '已进入全屏 — 不会因手势变化退出', 'full');
    }

    else setState('RECT / 抠洞', '食指与拇指构成矩形 — 透过它看视频', 'live');
    return;
  }

  // 单手：回到光点
  mode = 'point';
  const c = list[0][9];
  pointPos = { x: (1 - c.x) * skel.width, y: c.y * skel.height };
  targetReveal = 0.35; targetFull = 0;
  setState('SINGLE / 单手', '把另一只手放进来构成矩形', '');
}

/* ---------- MediaPipe 加载（多 CDN） ---------- */
const VISION_SOURCES = [
  { js: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs',
    wasm: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm' },
  { js: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs',
    wasm: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.18/wasm' },
  { js: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs',
    wasm: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm' }
];
let VISION_WASM = VISION_SOURCES[0].wasm;
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}
async function loadVision() {
  let last = null;
  for (const s of VISION_SOURCES) {
    try {
      const m = await withTimeout(import(s.js), 9000);
      if (m && m.HandLandmarker && m.FilesetResolver) { VISION_WASM = s.wasm; return m; }
    } catch (e) { last = e; }
  }
  throw new Error('无法加载 MediaPipe：' + (last && last.message || 'unknown'));
}

/* ---------- 启动 ---------- */
async function start() {
  const b = $('#start');
  b.disabled = true; b.textContent = '正在启动...';
  setState('请求摄像头权限', '请在弹出的提示中选择“允许”', 'warn');
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('此浏览器不支持摄像头');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 1280, height: 720 }, audio: false });
    cam.srcObject = stream; await cam.play();
    camOn = true; resizeSkel();
    setState('摄像头已开启', '正在加载手部模型', 'ok');
    const vision = await loadVision();
    const fileset = await vision.FilesetResolver.forVisionTasks(VISION_WASM);
    const landmarker = await withTimeout(vision.HandLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5, minHandPresenceConfidence: 0.5
    }), 30000);
    b.textContent = '摄像头已启用';
    setState('READY / 就绪', '双手食指+拇指比出矩形，撑满镜头后全屏播放', 'ok');
    let prev = -1, fps = 0, fAt = performance.now();
    const tick = () => {
      requestAnimationFrame(tick);
      if (cam.readyState < 2) return;
      const now = performance.now();
      if (now - prev < 26) return;
      prev = now;
      let list = [];
      try { list = landmarker.detectForVideo(cam, now).landmarks || []; } catch (e) { return; }
      onHands(list);
      drawSkeleton(list, mode === 'point');
      fps++;
      if (now - fAt > 1000) { $('#fps').textContent = 'FPS ' + fps; fps = 0; fAt = now; }
    };
    tick();
  } catch (e) {
    console.error(e);
    b.disabled = false; b.textContent = '重试摄像头';
    if (e.name === 'NotAllowedError') showErr('摄像头权限被拒绝。请点击地址栏左侧的摄像头图标改为“允许”，然后刷新页面。');
    else if (e.name === 'NotFoundError') showErr('未检测到摄像头设备。');
    else showErr('启动失败：' + (e.name || '') + ' ' + (e.message || ''));
    setState('CAMERA ERROR', null, 'bad');
  }
}
function showErr(m) { errEl.textContent = m; errEl.style.display = 'block'; }

/* ---------- 上传本地视频 ---------- */
$('#pick').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  bgVideo.src = url;
  bgVideo.loop = true; bgVideo.muted = false;
  bgVideo.play().then(() => {
    hasUserVideo = true;
    $('#loadState').textContent = '已载入：' + f.name;
    if (!camOn) setState('视频就绪', '现在点击“启用摄像头”开始', 'ok');
  }).catch(() => {
    bgVideo.muted = true;
    bgVideo.play().catch(() => {});
    hasUserVideo = true;
    $('#loadState').textContent = '已载入（静音播放）：' + f.name;
  });
});
$('#demoVideo').addEventListener('click', () => {
  // 无本地文件时用内置测试视频
  bgVideo.src = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
  bgVideo.loop = true; bgVideo.muted = true;
  bgVideo.play().catch(() => {});
  hasUserVideo = true;
  $('#loadState').textContent = '已载入示例视频';
});

$('#start').addEventListener('click', start);

/* ---------- 退出全屏 ---------- */
function exitFull() {
  isFull = false;
  targetFull = 0; fullMix = 0;
  targetReveal = 0; reveal = 0;
  smoothRect = null; mode = 'idle';
  glitch();
  setState('READY / 已退出全屏', '可重新比出矩形抠洞', 'ok');
}
$('#exitFull').addEventListener('click', exitFull);

/* ---------- 可调参数 ---------- */
let FEATHER = 8;
$('#th').addEventListener('input', e => {
  FULL_THRESHOLD = Number(e.target.value) / 100;
  $('#thVal').textContent = e.target.value + '%';
  $('#fullbar').querySelector('.lbl').textContent = 'FULLSCREEN PROGRESS (' + e.target.value + '%)';
});
$('#fw').addEventListener('input', e => {
  FEATHER = Number(e.target.value);
  $('#fwVal').textContent = e.target.value;
});



/* ---------- 渲染循环 ---------- */
function loop() {
  requestAnimationFrame(loop);
  const lerp = (a, b, k) => a + (b - a) * k;
  reveal = lerp(reveal, targetReveal, 0.12);
  fullMix = lerp(fullMix, targetFull, 0.08);
  $('#fullbar').style.opacity = fullMix > 0.05 ? 1 : 0;
  $('#fullbar').querySelector('.fill2').style.width = Math.round(fullMix * 100) + '%';
  $('#fullbar').querySelector('.lbl').textContent = isFull
    ? 'FULLSCREEN / 已锁定'
    : 'FULLSCREEN PROGRESS (' + Math.round(FULL_THRESHOLD * 100) + '%)';
  const exBtn = $('#exitFull');
  if (exBtn) exBtn.style.display = isFull ? 'inline-block' : 'none';
  renderMask();
  if (isFull) {
    if (skel.width) sctx.clearRect(0, 0, skel.width, skel.height);
  } else {
    drawSkeleton(lastList, mode === 'point');
  }
  drawHexGrid();
}
loop();
resizeSkel();
window.__ready = true;
if (bootEl) bootEl.style.display = 'none';
</script>
