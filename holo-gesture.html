<script>
window.__bootErrors = [];
window.addEventListener('error', e => {
  var m = e && e.message ? e.message : 'unknown';
  window.__bootErrors.push(m);
  var el = document.getElementById('boot');
  if (el) { el.style.display = 'block'; el.textContent = 'BOOT ERROR: ' + m; }
}, true);
window.addEventListener('unhandledrejection', e => {
  var m = (e && e.reason) ? (e.reason.name || '') + ' ' + (e.reason.message || e.reason) : 'unknown';
  window.__bootErrors.push(m);
  var el = document.getElementById('boot');
  if (el) { el.style.display = 'block'; el.textContent = 'BOOT ERROR: ' + m; }
});
setTimeout(function () {
  var el = document.getElementById('boot');
  if (el && !window.__ready) {
    el.style.display = 'block';
    el.textContent = 'BOOT TIMEOUT: 模块未启动（可能是 CDN 被拦截）' + (window.__bootErrors.length ? ' / ' + window.__bootErrors[0] : '');
  }
}, 9000);
</script>
<script type="module">

import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const $ = s => document.querySelector(s);
const video = $('#cam'), skel = $('#skel'), sctx = skel.getContext('2d');
const stateEl = $('#state'), handsEl = $('#hands'), binEl = $('#bin');
const CYAN = '#39e6ff', PINK = '#ff5cc8';

/* ---------------- 渲染器 ---------------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 9);

scene.add(new THREE.AmbientLight(0x223355, 1.4));
const key = new THREE.DirectionalLight(0x9fd8ff, 2.4); key.position.set(5, 7, 6); scene.add(key);
const pCyan = new THREE.PointLight(0x39e6ff, 60, 40); pCyan.position.set(-5, -2, 4); scene.add(pCyan);
const pPink = new THREE.PointLight(0xff3fa0, 60, 40); pPink.position.set(5, 3, 4); scene.add(pPink);
const pViolet = new THREE.PointLight(0x8a3cff, 40, 36); pViolet.position.set(0, 5, -4); scene.add(pViolet);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.35, 0.85, 0.16);
composer.addPass(bloom);

/* ---------------- 全息材质 ---------------- */
function holo(cA, cB, cEdge) {
  return new THREE.ShaderMaterial({
    transparent: true, side: THREE.DoubleSide, depthWrite: false,
    uniforms: {
      uA: { value: new THREE.Color(cA) }, uB: { value: new THREE.Color(cB) },
      uE: { value: new THREE.Color(cEdge) }, uT: { value: 0 },
      uOpen: { value: 0 }, uFade: { value: 1 }
    },
    vertexShader: 'varying vec3 vN;varying vec3 vV;varying vec3 vP;varying float vY;' +
      'void main(){vec4 wp=modelMatrix*vec4(position,1.0);vN=normalize(mat3(modelMatrix)*normal);' +
      'vV=normalize(cameraPosition-wp.xyz);vP=position;vY=position.y;' +
      'gl_Position=projectionMatrix*viewMatrix*wp;}',
    fragmentShader: 'uniform vec3 uA;uniform vec3 uB;uniform vec3 uE;uniform float uT;uniform float uOpen;uniform float uFade;' +
      'varying vec3 vN;varying vec3 vV;varying vec3 vP;varying float vY;' +
      'void main(){vec3 N=normalize(vN);vec3 V=normalize(vV);' +
      'float fres=pow(1.0-clamp(dot(N,V),0.0,1.0),2.2);' +
      'float band=smoothstep(-1.0,1.0,vY+sin(vP.x*4.0+uT*1.2)*0.25);' +
      'band=mix(band,fract(vY*1.8+uT*0.3),uOpen*0.5);' +
      'vec3 base=mix(uA,uB,band);' +
      'float grid=step(0.94,fract(vP.x*6.0))*step(0.94,fract(vP.y*6.0));' +
      'vec3 col=base*(0.5+fres*0.9)+uE*(fres*1.5+grid*0.6);' +
      'float edge=smoothstep(0.72,1.0,fres);' +
      'col+=uE*edge*1.1;' +
      'gl_FragColor=vec4(col,clamp(0.34+fres*0.75,0.0,1.0)*uFade);}'
  });
}

const MAT = {
  gem: holo(0x2fd8ff, 0xff3fa0, 0x9ff0ff),
  hex: holo(0x39e6ff, 0x8a3cff, 0x7cf0ff),
  tri: holo(0x7c4dff, 0xff2f8a, 0xffb0ff)
};

/* 形变几何体：同一份顶点在 菱形/三角/六边形 之间切换 */
function crystalGeometry() {
  const g = new THREE.OctahedronGeometry(1, 2);
  const pos = g.attributes.position;
  g.userData.base = Float32Array.from(pos.array);
  return g;
}
function shapeTarget(kind, v) {
  const x = v.x, y = v.y, z = v.z;
  if (kind === 'tri') {
    const k = (y + 1) / 2;
    return [x * (1 - k) * 1.25, y * 1.05, z * 0.6 + Math.sin((x + y) * 3) * 0.05];
  }
  if (kind === 'hex') {
    const r = Math.hypot(x, z) || 1e-4, a = Math.atan2(z, x);
    const step = Math.PI / 3;
    const q = Math.round(a / step) * step;
    const k = Math.cos(a - q) || 1e-4;
    const rr = (r / k) * 1.15;
    return [rr * Math.cos(q), y * 0.75, rr * Math.sin(q)];
  }
  return [x, y, z];
}

function buildCrystal() {
  const geo = crystalGeometry();
  const mesh = new THREE.Mesh(geo, MAT.gem);
  const wire = new THREE.LineSegments(
    new THREE.WireframeGeometry(new THREE.OctahedronGeometry(1.004, 0)),
    new THREE.LineBasicMaterial({ color: 0x9ff0ff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending })
  );
  const halo = new THREE.Mesh(new THREE.RingGeometry(1.5, 1.54, 96),
    new THREE.MeshBasicMaterial({ color: 0x39e6ff, transparent: true, opacity: 0.7, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  const halo2 = new THREE.Mesh(new THREE.RingGeometry(1.72, 1.735, 96),
    new THREE.MeshBasicMaterial({ color: 0xff3fa0, transparent: true, opacity: 0.5, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  const g = new THREE.Group();
  g.add(mesh, wire, halo, halo2);
  g.userData = { geo, mesh, wire, halo, halo2, kind: 'gem', morph: 1, base: 'gem' };
  return g;
}

/* ---------------- 粒子消散 ---------------- */
const PMAX = 900;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PMAX * 3);
const pCol = new Float32Array(PMAX * 3);
const pVel = new Float32Array(PMAX * 3);
const pLife = new Float32Array(PMAX);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.075, vertexColors: true, transparent: true, opacity: 0.95,
  depthWrite: false, blending: THREE.AdditiveBlending
}));
scene.add(points);
let pHead = 0;
function burst(center, count, spread) {
  for (let i = 0; i < count; i++) {
    const k = pHead++ % PMAX, i3 = k * 3;
    pPos[i3] = center.x + (Math.random() - 0.5) * spread;
    pPos[i3 + 1] = center.y + (Math.random() - 0.5) * spread;
    pPos[i3 + 2] = center.z + (Math.random() - 0.5) * spread;
    const s = 0.055 + Math.random() * 0.14;
    pVel[i3] = (Math.random() - 0.5) * s * 2.4;
    pVel[i3 + 1] = (Math.random() - 0.2) * s * 2.4;
    pVel[i3 + 2] = (Math.random() - 0.5) * s * 1.6;
    const t = Math.random();
    pCol[i3] = 0.2 + t * 0.8; pCol[i3 + 1] = 0.9 - t * 0.5; pCol[i3 + 2] = 1.0;
    pLife[k] = 1;
  }
}
function updateParticles(dt) {
  for (let k = 0; k < PMAX; k++) {
    if (pLife[k] <= 0) continue;
    const i3 = k * 3;
    pPos[i3] += pVel[i3]; pPos[i3 + 1] += pVel[i3 + 1]; pPos[i3 + 2] += pVel[i3 + 2];
    pVel[i3] *= 0.985; pVel[i3 + 1] = pVel[i3 + 1] * 0.985 + 0.00035; pVel[i3 + 2] *= 0.985;
    pLife[k] -= dt * 0.75;
    if (pLife[k] <= 0) { pPos[i3] = 9e9; pPos[i3 + 1] = 9e9; pPos[i3 + 2] = 9e9; }
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

/* ---------------- 二进制代码环 ---------------- */
function makeBinChip(text, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 256, 64);
  g.font = '700 40px Consolas, monospace';
  g.fillStyle = color; g.shadowColor = color; g.shadowBlur = 18;
  g.fillText(text, 8, 46);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(0.92, 0.23),
    new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
}
function buildBinRing() {
  const g = new THREE.Group();
  const n = 14, R = 2.28;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const txt = Array.from({ length: 7 }, () => (Math.random() < 0.5 ? '0' : '1')).join('');
    const chip = makeBinChip(txt, i % 2 ? CYAN : PINK);
    chip.position.set(Math.cos(a) * R, Math.sin(a) * R, 0);
    chip.userData.a = a; chip.userData.r = R; chip.userData.txt = txt;
    g.add(chip);
  }
  const lineGeo = new THREE.BufferGeometry();
  const lp = [];
  for (let i = 0; i < 96; i++) {
    const a1 = (i / 96) * Math.PI * 2, a2 = ((i + 1) / 96) * Math.PI * 2;
    lp.push(Math.cos(a1) * R, Math.sin(a1) * R, 0, Math.cos(a2) * R, Math.sin(a2) * R, 0);
  }
  lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
  g.add(new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
    color: 0x39e6ff, transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending })));
  const connectors = new THREE.LineSegments(new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ color: 0xff5cc8, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending }));
  const cp = [];
  for (let i = 0; i < n; i += 2) {
    const a = (i / n) * Math.PI * 2, a2 = ((i + 1) / n) * Math.PI * 2;
    cp.push(Math.cos(a) * R, Math.sin(a) * R, 0, Math.cos(a2) * R, Math.sin(a2) * R, 0);
  }
  connectors.geometry.setAttribute('position', new THREE.Float32BufferAttribute(cp, 3));
  g.add(connectors);
  return g;
}

/* ---------------- 漂浮 01 粒子背景 ---------------- */
function buildFloatBits() {
  const g = new THREE.Group();
  const n = 90;
  for (let i = 0; i < n; i++) {
    const chip = makeBinChip(Math.random() < 0.5 ? '0' : '1', Math.random() < 0.5 ? CYAN : PINK);
    chip.scale.setScalar(0.34 + Math.random() * 0.3);
    chip.position.set((Math.random() - 0.5) * 36, (Math.random() - 0.5) * 22, -6 - Math.random() * 16);
    chip.userData.sp = 0.12 + Math.random() * 0.5;
    chip.material.opacity = 0.22 + Math.random() * 0.4;
    chip.material.transparent = true;
    g.add(chip);
  }
  return g;
}


/* ---------------- 卡片模型（双手靠近召唤） ---------------- */
function cardTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 640;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 1024, 640);
  grad.addColorStop(0, '#0d2a5c'); grad.addColorStop(.45, '#5a1a68'); grad.addColorStop(1, '#0a3a5c');
  g.fillStyle = grad; g.fillRect(0, 0, 1024, 640);
  g.strokeStyle = 'rgba(140,225,255,.5)'; g.lineWidth = 2;
  for (let i = 0; i <= 1024; i += 56) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 640); g.stroke(); }
  for (let i = 0; i <= 640; i += 56) { g.beginPath(); g.moveTo(0, i); g.lineTo(1024, i); g.stroke(); }
  g.strokeStyle = 'rgba(255,110,200,.85)'; g.lineWidth = 5;
  g.strokeRect(28, 28, 968, 584);
  g.fillStyle = 'rgba(255,255,255,.9)'; g.font = '700 60px Consolas, monospace';
  g.fillText('ASSET  /  1210100', 96, 128);
  g.fillStyle = 'rgba(180,240,255,.85)'; g.font = '600 40px Consolas, monospace';
  g.fillText('IMAGE PLACEHOLDER', 96, 210);
  g.strokeStyle = 'rgba(140,225,255,.7)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(96, 268); g.lineTo(96, 400); g.lineTo(228, 400); g.stroke();
  g.beginPath(); g.moveTo(928, 268); g.lineTo(928, 400); g.lineTo(796, 400); g.stroke();
  g.beginPath(); g.arc(512, 500, 62, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(512, 438); g.lineTo(512, 562); g.stroke();
  g.beginPath(); g.moveTo(450, 500); g.lineTo(574, 500); g.stroke();
  g.fillStyle = 'rgba(255,120,205,.95)'; g.font = '600 34px Consolas, monospace';
  g.fillText('DUAL HAND SUMMON', 330, 604);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const CARD_MAT = holo(0x2f6bff, 0xb14bff, 0x6ff0ff);
function buildCardModel() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.1, 1.98, 0.08), CARD_MAT);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(2.92, 1.82), new THREE.MeshBasicMaterial({
    map: cardTexture(), transparent: true, side: THREE.DoubleSide }));
  face.position.z = 0.05;
  const frame = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(3.16, 2.04, 0.08)),
    new THREE.LineBasicMaterial({ color: 0x9ff0ff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending }));
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(3.7, 2.5), new THREE.MeshBasicMaterial({
    color: 0x4b6bff, transparent: true, opacity: 0.18, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  glow.position.z = -0.08;
  const halo = new THREE.Mesh(new THREE.RingGeometry(2.1, 2.14, 96), new THREE.MeshBasicMaterial({
    color: 0xff5cc8, transparent: true, opacity: 0.6, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  g.add(body, face, frame, glow, halo);
  g.userData = { body, face, frame, glow, halo, spin: 0 };
  return g;
}

const card = buildCardModel(); card.visible = false; world.add(card);

/* ---------------- 手掌中心光晕 ---------------- */
function buildPalmGlow() {
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.CircleGeometry(0.5, 48), new THREE.MeshBasicMaterial({
    color: 0x9ff0ff, transparent: true, opacity: 0.42, blending: THREE.AdditiveBlending, depthWrite: false }));
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.62, 0.68, 64), new THREE.MeshBasicMaterial({
    color: 0x39e6ff, transparent: true, opacity: 0.8, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  const ring2 = new THREE.Mesh(new THREE.RingGeometry(0.86, 0.9, 64), new THREE.MeshBasicMaterial({
    color: 0xff5cc8, transparent: true, opacity: 0.55, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  g.add(core, ring, ring2);
  g.userData = { core, ring, ring2 };
  return g;
}
const palmGlow = buildPalmGlow(); scene.add(palmGlow);
let palmTarget = new THREE.Vector3(), palmHas = false;

function updatePalmGlow(dt, t) {
  const want = palmHas && !card.visible ? 1 : 0;
  palmGlow.scale.x += ((want ? 1 : 0.001) - palmGlow.scale.x) * Math.min(1, dt * 9);
  palmGlow.scale.y = palmGlow.scale.x; palmGlow.scale.z = palmGlow.scale.x;
  palmGlow.position.lerp(palmTarget, Math.min(1, dt * 8));
  palmGlow.rotation.z = t * 0.8;
  const u = palmGlow.userData;
  u.core.material.opacity = 0.34 + Math.sin(t * 3) * 0.1;
  u.ring.rotation.z = t * 1.4;
  u.ring2.rotation.z = -t * 0.9;
  u.ring2.scale.setScalar(1 + Math.sin(t * 2.3) * 0.08);
}

function updateCard(dt, t) {
  if (!card.userData) return;
  const u = card.userData;
  u.body.material.uniforms.uT.value = t;
  u.body.material.uniforms.uOpen.value = curOpen;
  u.body.material.uniforms.uFade.value = card.visible ? 1 : 0;
  u.spin += (targetCardSpin - u.spin) * Math.min(1, dt * 6);
  const ry = u.spin + Math.sin(t * 0.4) * 0.25;
  u.body.rotation.y = ry; u.face.rotation.y = ry;
  u.frame.rotation.y = ry; u.glow.rotation.y = ry;
  u.halo.rotation.z = t * 0.5; u.halo.scale.setScalar(1 + curOpen * 1.2);
  u.frame.material.opacity = 0.55 + Math.sin(t * 3.4) * 0.3;
  u.glow.material.opacity = 0.14 + Math.sin(t * 2.2) * 0.06;
  u.halo.material.opacity = 0.5 * (card.visible ? 1 : 0);
  u.face.material.opacity = card.visible ? 1 : 0;
  u.face.material.transparent = true;
}
let targetCardSpin = 0;

/* ---------------- HUD 与中央大字 ---------------- */
const camStateEl = $('#camState'), handStateEl = $('#handState'), gestStateEl = $('#gestState');
const ghostIcon = $('#ghostIcon'), ghostText = $('#ghostText'), ghostEl = $('#ghost'), hintEl = $('#hint');
function setHud(gesture, icon, bigText, hint) {
  gestStateEl.textContent = gesture;
  gestStateEl.className = gesture === 'IDLE' ? '' : 'hgest';
  if (icon && ghostIcon.textContent !== icon) {
    ghostIcon.textContent = icon;
    ghostEl.classList.add('big');
    clearTimeout(ghostEl._t);
    ghostEl._t = setTimeout(() => ghostEl.classList.remove('big'), 420);
  }
  if (bigText) ghostText.textContent = bigText;
  if (hint) { hintEl.textContent = hint; hintEl.classList.add('on'); }
  else hintEl.classList.remove('on');
}
function setHandState(n) {
  handStateEl.textContent = n ? (n + ' 只手') : '未检测';
  handStateEl.className = n ? 'live' : '';
}
function setCamState(text, cls) { camStateEl.textContent = text; camStateEl.className = cls || ''; }

/* ---------------- 状态 ---------------- */
const world = new THREE.Group(); scene.add(world);
const crystal = buildCrystal(); crystal.visible = false; world.add(crystal);
const binRing = buildBinRing(); binRing.visible = false; crystal.add(binRing);
const bits = buildFloatBits(); scene.add(bits);

let targetPos = new THREE.Vector3();
let curPos = new THREE.Vector3();
let targetScale = 1, curScale = 1;
let targetOpen = 0, curOpen = 0;
let fade = 1, targetFade = 1;
let palm = null, lastSeen = 0, active = false;
let shape = 'gem', nextShape = 0, shapeAt = 0;
let pinchLatched = false;
const SHAPES = ['gem', 'tri', 'hex'];

const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const TIPS = [4, 8, 12, 16, 20];

const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const scaleOf = lm => d2(lm[0], lm[9]) || 0.1;
const pinchOf = lm => d2(lm[4], lm[8]) / scaleOf(lm);
const isFist = lm => { const p = lm[9], r = scaleOf(lm); return [8,12,16,20].every(i => d2(lm[i], p) < r * 1.18); };
const isOpen = lm => { const p = lm[9], r = scaleOf(lm); return [8,12,16,20].filter(i => d2(lm[i], p) > r * 1.9).length >= 4; };

function setShape(kind) {
  shape = kind;
  crystal.userData.base = kind;
  crystal.userData.morph = 0;
  const g = crystal.userData.geo;
  const base = g.userData.base, pos = g.attributes.position;
  if (!g.userData.to) g.userData.to = new Float32Array(base.length);
  for (let i = 0; i < pos.count; i++) {
    const v = new THREE.Vector3(base[i * 3], base[i * 3 + 1], base[i * 3 + 2]);
    const t = shapeTarget(kind, v);
    g.userData.to[i * 3] = t[0]; g.userData.to[i * 3 + 1] = t[1]; g.userData.to[i * 3 + 2] = t[2];
  }
}

function show(on) {
  if (on && !active) { crystal.visible = true; binRing.visible = true; targetFade = 1; fade = 0; }
  if (!on && active) {
    burst(curPos, 320, 1.7);
    targetFade = 0;
  }
  active = on;
}

function vanish() {
  if (active) burst(curPos, 380, 1.9);
  active = false; crystal.visible = false; binRing.visible = false; fade = 0; targetFade = 0;
}

function onHands(list) {
  const now = performance.now();
  handsEl.textContent = 'HANDS: ' + list.length;
  setHandState(list.length);

  if (!list.length) {
    palmHas = false;
    if (now - lastSeen > 300) { vanish(); setHud('IDLE', null, null, null); setHandState(0); }
    return;
  }
  lastSeen = now;

  /* ---------- 双手靠近：召唤卡片 ---------- */
  if (list.length >= 2) {
    const a = list[0], b = list[1];
    const gap = d2(a[9], b[9]);
    palmHas = false;
    if (gap < 0.34) {
      if (!card.visible) { card.visible = true; burst(curPos, 160, 1.2); }
      crystal.visible = false; binRing.visible = false; active = false;
      const mid = { x: (a[9].x + b[9].x) / 2, y: (a[9].y + b[9].y) / 2 };
      targetPos.set((0.5 - mid.x) * 13, (0.5 - mid.y) * 8, 0);
      targetScale = THREE.MathUtils.clamp(1.45 - gap * 1.8, 0.75, 1.7);
      targetCardSpin = THREE.MathUtils.clamp((b[9].x - a[9].x) * 3.4, -1.1, 1.1);
      targetOpen = THREE.MathUtils.clamp((0.36 - gap) * 4.5, 0, 1);
      setHud('双手靠近 / 卡片', '🖐️🖐️', 'SUMMON', '双手靠近 — 素材卡片');
      return;
    }
    if (card.visible && gap > 0.5) { burst(curPos, 220, 1.5); card.visible = false; }
  }

  if (card.visible) { burst(curPos, 200, 1.4); card.visible = false; }

  const lm = list[0];
  palm = lm[9];
  palmHas = true;
  palmTarget.set((0.5 - palm.x) * 13, (0.5 - palm.y) * 8, 0.6);

  /* ---------- 握拳：清除所有对象 ---------- */
  if (isFist(lm)) {
    pinchLatched = false;
    if (active) burst(curPos, 420, 2.0);
    active = false; crystal.visible = false; binRing.visible = false;
    setHud('握拳 / 清除', '✊', 'CLEAR', '握拳 — 清除全部对象');
    return;
  }

  const p = pinchOf(lm);

  /* ---------- 张开：图形放大展开 ---------- */
  if (isOpen(lm)) {
    show(true);
    targetOpen = 1;
    targetScale = 1.6;
    setHud('张开 / 展开', '🖐️', 'EXPAND', '张开手掌 — 放大展开');
  }
  /* ---------- 捏合：生成全息几何图形 ---------- */
  else if (p < 0.75) {
    if (!pinchLatched) {
      pinchLatched = true; shapeAt = now;
      nextShape = (nextShape + 1) % 3;
      setShape(SHAPES[nextShape]);
    }
    show(true);
    targetOpen = 0.18;
    targetScale = THREE.MathUtils.clamp(1.45 - d2(lm[4], lm[8]) * 4.4, 0.6, 2.4);
    setHud('捏合 / ' + shape.toUpperCase(), '👌', 'PINCH',
      '捏合 — 生成 ' + (shape === 'gem' ? '菱形' : shape === 'tri' ? '三角形' : '六边形'));
  } else if (p > 1.0) {
    pinchLatched = false;
    if (active) { targetOpen = 0.3; targetScale = 1; setHud('捏合 / ' + shape.toUpperCase(), '👌', 'PINCH', null); }
    else setHud('IDLE', null, 'HOLO FORGE', null);
  }

  if (active) {
    targetPos.set((0.5 - palm.x) * 13, (0.5 - palm.y) * 8, (0.5 - (palm.z || 0)) * 4);
  }
}

/* ---------------- 骨架叠加 ---------------- */
function drawSkeleton(list) {
  const r = skel.getBoundingClientRect();
  const W = Math.round(r.width * 2), H = Math.round(r.height * 2);
  if (skel.width !== W || skel.height !== H) { skel.width = W; skel.height = H; }
  sctx.clearRect(0, 0, skel.width, skel.height);
  if (!list.length) return;
  const pt = p => ({ x: (1 - p.x) * skel.width, y: p.y * skel.height });
  sctx.lineCap = 'round';
  for (const lm of list) {
    sctx.strokeStyle = 'rgba(57,230,255,.92)';
    sctx.shadowColor = 'rgba(57,230,255,.95)'; sctx.shadowBlur = 14; sctx.lineWidth = 3.4;
    for (const [i, j] of BONES) {
      const A = pt(lm[i]), B = pt(lm[j]);
      sctx.beginPath(); sctx.moveTo(A.x, A.y); sctx.lineTo(B.x, B.y); sctx.stroke();
    }
    sctx.shadowBlur = 0;
    sctx.fillStyle = 'rgba(57,230,255,.85)';
    for (let i = 0; i < lm.length; i++) {
      if (TIPS.includes(i)) continue;
      const q = pt(lm[i]);
      sctx.beginPath(); sctx.arc(q.x, q.y, 2.4, 0, Math.PI * 2); sctx.fill();
    }
    for (const i of TIPS) {
      const q = pt(lm[i]);
      sctx.shadowColor = 'rgba(255,92,200,1)'; sctx.shadowBlur = 20;
      sctx.fillStyle = 'rgba(255,92,200,.98)';
      sctx.beginPath(); sctx.arc(q.x, q.y, 5.2, 0, Math.PI * 2); sctx.fill();
      sctx.strokeStyle = 'rgba(255,190,235,.95)'; sctx.lineWidth = 1.6;
      sctx.beginPath(); sctx.arc(q.x, q.y, 8.6, 0, Math.PI * 2); sctx.stroke();
    }
    sctx.shadowBlur = 0;
  }
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
let binTick = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.getElapsedTime();
  if (demo) demoStep(dt);

  curPos.lerp(targetPos, 1 - Math.pow(0.001, dt * 2.4));
  curScale += (targetScale - curScale) * Math.min(1, dt * 9);
  curOpen += (targetOpen - curOpen) * Math.min(1, dt * 7);
  fade += (targetFade - fade) * Math.min(1, dt * 8);

  world.position.copy(curPos);
  world.scale.setScalar(curScale);

  const u = crystal.userData;
  u.mesh.material.uniforms.uT.value = t;
  u.mesh.material.uniforms.uOpen.value = curOpen;
  u.mesh.material.uniforms.uFade.value = fade;
  u.mesh.material.opacity = fade;

  if (u.morph < 1) {
    u.morph = Math.min(1, u.morph + dt * 3.4);
    const base = u.geo.userData.base, to = u.geo.userData.to, pos = u.geo.attributes.position;
    const k = u.morph < 0.5 ? 2 * u.morph * u.morph : 1 - Math.pow(-2 * u.morph + 2, 2) / 2;
    for (let i = 0; i < pos.count * 3; i++) pos.array[i] = base[i] + (to[i] - base[i]) * k;
    pos.needsUpdate = true;
    u.geo.computeVertexNormals();
  }

  const spin = 0.22 + curOpen * 0.5;
  u.mesh.rotation.y = t * spin; u.mesh.rotation.x = Math.sin(t * 0.5) * 0.25;
  u.wire.rotation.copy(u.mesh.rotation);
  u.wire.scale.setScalar(1 + curOpen * 0.55);
  u.halo.rotation.z = t * 0.6; u.halo2.rotation.z = -t * 0.4;
  u.halo.scale.setScalar(1 + curOpen * 1.1); u.halo2.scale.setScalar(1 + curOpen * 1.35);
  u.halo.material.opacity = 0.55 * fade; u.halo2.material.opacity = 0.4 * fade;

  binRing.rotation.z = -t * 0.35;
  binRing.children.forEach((c, i) => {
    if (c.userData.r === undefined) return;
    const a = c.userData.a + t * 0.35;
    c.position.set(Math.cos(a) * c.userData.r, Math.sin(a) * c.userData.r, 0);
    c.material.opacity = fade * (0.55 + 0.45 * Math.sin(t * 3 + i));
  });
  binTick += dt;
  if (binTick > 0.5) {
    binTick = 0;
    binRing.children.forEach((c, i) => {
      if (c.userData.r === undefined || i % 3) return;
      const txt = Array.from({ length: 7 }, () => (Math.random() < 0.5 ? '0' : '1')).join('');
      const old = c.material.map;
      const chip = makeBinChip(txt, i % 2 ? CYAN : PINK);
      c.material.map = chip.material.map; c.material.needsUpdate = true;
      chip.material.map.dispose(); old.dispose();
    });
    binEl.textContent = Array.from({ length: 16 }, () => (Math.random() < 0.5 ? '0' : '1')).join('');
  }

  bits.children.forEach((c, i) => {
    c.position.y += c.userData.sp * dt;
    if (c.position.y > 12) c.position.y = -12;
    c.position.x += Math.sin(t * 0.3 + i) * dt * 0.12;
  });

  updateCard(dt, t);
  updatePalmGlow(dt, t);
  updateParticles(dt);
  pCyan.position.x = -5 + Math.sin(t * 0.7) * 1.1;
  pPink.position.y = 3 + Math.cos(t * 0.6) * 1.1;
  composer.render();
}
loop();

/* ---------------- 摄像头 ---------------- */
const errEl = $('#err');
function fail(m) { errEl.textContent = m; errEl.style.display = 'block'; }

async function start() {
  const b = $('#start');
  b.disabled = true; b.textContent = '正在启动...';
  setCamState('请求权限...', 'warn');
  stateEl.textContent = '请求摄像头权限';
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 1280, height: 720 }, audio: false });
    video.srcObject = stream; await video.play();
    video.classList.add('on');
    setCamState('已开启', 'ok');
    setHud('IDLE', '✋', 'HOLO FORGE', '把手放进画面');
    stateEl.textContent = '加载手部模型';
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');
    const fs2 = await vision.FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');
    const landmarker = await vision.HandLandmarker.createFromOptions(fs2, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5, minHandPresenceConfidence: 0.5
    });
    b.textContent = '摄像头已启用';
    setCamState('实时追踪中', 'live');
    setHud('IDLE', '✋', 'HOLO FORGE', '捏合 · 张开 · 握拳 · 双手靠近');
    stateEl.textContent = 'IDLE / 把手放进画面';
    let prev = -1, fps = 0, fAt = performance.now();
    const tick = () => {
      requestAnimationFrame(tick);
      if (video.readyState < 2) return;
      const now = performance.now();
      if (now - prev < 26) return;
      prev = now;
      let list = [];
      try { list = landmarker.detectForVideo(video, now).landmarks || []; } catch (e) { return; }
      onHands(list);
      drawSkeleton(list);
      fps++;
      if (now - fAt > 1000) { $('#fps').textContent = 'FPS ' + fps; fps = 0; fAt = now; }
    };
    tick();
  } catch (e) {
    console.error(e);
    b.disabled = false; b.textContent = '重试摄像头';
    if (e.name === 'NotAllowedError') fail('摄像头权限被拒绝。请点击地址栏左侧的摄像头图标，把权限改为“允许”，然后刷新页面。');
    else if (e.name === 'NotFoundError') fail('未检测到摄像头设备，请检查设备连接。');
    else if (e.message === 'unsupported') fail('当前浏览器不支持摄像头，请使用 Chrome 或 Edge。');
    else fail('启动失败：' + (e.name || e.message) + '。可点击“演示模式”先看效果。');
    stateEl.textContent = 'CAMERA ERROR / DEMO READY';
    setCamState('启动失败', 'bad');
  }
}

/* ---------------- 演示模式 ---------------- */
let demo = false, demoT = 0;
function demoStep(dt) {
  demoT += dt;
  const cyc = demoT % 18;
  if (cyc < 4.5) { if (!active) { setShape('gem'); show(true); } targetOpen = 0.2; targetScale = 1.15; stateEl.textContent = 'DEMO / 捏合 · 菱形'; }
  else if (cyc < 8) { if (shape !== 'tri') setShape('tri'); show(true); targetOpen = 0.35; targetScale = 1.3; stateEl.textContent = 'DEMO / 捏合 · 三角形'; }
  else if (cyc < 11.5) { if (shape !== 'hex') setShape('hex'); show(true); targetOpen = 0.4; targetScale = 1.4; stateEl.textContent = 'DEMO / 捏合 · 六边形'; }
  else if (cyc < 15) { show(true); targetOpen = 1; targetScale = 1.85; stateEl.textContent = 'DEMO / 张开手掌 · 展开'; }
  else { if (active) { burst(curPos, 380, 1.9); active = false; crystal.visible = false; binRing.visible = false; } stateEl.textContent = 'DEMO / 握拳 · 粒子消散'; }
  targetPos.set(Math.sin(demoT * 0.55) * 2.1, Math.cos(demoT * 0.8) * 1.05, 0);
  handsEl.textContent = 'HANDS: demo';
}

$('#start').addEventListener('click', start);
$('#demo').addEventListener('click', () => {
  demo = !demo;
  $('#demo').textContent = demo ? '停止演示' : '演示模式';
  if (!demo) { vanish(); stateEl.textContent = 'STANDBY'; }
});
$('#shapeBtn').addEventListener('click', () => {
  nextShape = (nextShape + 1) % 3;
  setShape(SHAPES[nextShape]);
  if (!active) show(true);
  stateEl.textContent = 'MANUAL / ' + shape.toUpperCase() + ' · ' + (nextShape + 1) + '/3';
});
addEventListener('pointerdown', () => { if (demo && active) burst(curPos, 140, 1.2); });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});
setShape('gem');
window.__ready = true;
var bootEl = document.getElementById('boot');
if (bootEl) bootEl.style.display = 'none';
</script>
